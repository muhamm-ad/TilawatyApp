name: Feature request
description: Suggest an improvement or new capability for Tilawaty.
title: "feat(): "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas need **maintainer confirmation** before they go on the backlog. Filing this form does not guarantee the feature will be built. For open-ended brainstorming, prefer [Discussions](https://github.com/muhamm-ad/TilawatyApp/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem are you trying to solve? Who is affected?
      placeholder: "When I … I need … because …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - reading
        - progress
        - browse
        - bookmarks
        - audio
        - translations
        - reminders
        - backup
        - settings
        - i18n
        - ui
        - a11y
        - performance
        - other / unsure
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms that should support this
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - All
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other apps (optional).
    validations:
      required: false
